name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (Qt5)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt5
      run: sudo apt update && sudo apt install -y qtbase5-dev libqt5sql5-sqlite

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Pack artifact
      run: |
        mkdir -p artifact
        cp build/StegoLab artifact/
        cp README.md artifact/
        ldd build/StegoLab | grep Qt | awk '{print $3}' | xargs -I{} cp {} artifact/ 2>/dev/null || true

    - uses: actions/upload-artifact@v4
      with:
        name: StegoLab-Linux
        path: artifact/

  create-release:
    name: Create Release
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4

    - name: Pack release assets
      run: |
        cd StegoLab-Linux && tar czf ../StegoLab-Linux.tar.gz . && cd ..

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: StegoLab ${{ github.ref_name }}
        body: |
          Автоматическая сборка ${{ github.ref_name }}.

          ### Что внутри
          - **StegoLab-Linux.tar.gz** — портативная сборка для Linux (Qt5)

          > **Внимание:** Для Linux требуется установленный Qt5 (`qtbase5-dev`).  
          > Для Windows собирай локально: cmake .. -G "MinGW Makefiles" && mingw32-make
        files: |
          StegoLab-Linux.tar.gz
